name: README badges
on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - SPRINTS.md
      - BACKLOG.md
      - CONTRIBUTING.md
      - RELEASES.md
      - SECURITY.md
      - package.json
      - package-lock.json
      - src/main/storage/store.ts
      - scripts/validate-readme-badges.mjs
      - .github/workflows/releases.yml
      - .github/workflows/readme-badges.yml
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - SPRINTS.md
      - BACKLOG.md
      - CONTRIBUTING.md
      - RELEASES.md
      - SECURITY.md
      - package.json
      - package-lock.json
      - src/main/storage/store.ts
      - scripts/validate-readme-badges.mjs
      - .github/workflows/releases.yml
      - .github/workflows/readme-badges.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  badge-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate verified badges
        run: node scripts/validate-readme-badges.mjs
