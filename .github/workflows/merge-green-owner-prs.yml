name: Merge owner PRs after checks
on:
  workflow_run:
    workflows: ["Desktop releases", "README badges"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    # The privileged workflow never checks out or executes PR code.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Verify latest PR revision and all applicable checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No associated pull request; skipping."
            exit 0
          fi

          metadata=$(gh api "repos/$REPO/pulls/$pr")
          if ! jq -e --arg repo "$REPO" --arg sha "$RUN_SHA" '
            .state == "open" and .draft == false and
            .user.login == "drakeg" and
            .head.repo.full_name == $repo and
            .base.ref == "main" and .head.sha == $sha
          ' <<< "$metadata" >/dev/null; then
            echo "PR is not an open, current, non-draft owner branch targeting main; skipping."
            exit 0
          fi

          checks=$(gh api "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100")
          # Require every platform's complete build (including installed-app tests,
          # packaging and audit). Failed, skipped, pending and missing checks block.
          for platform in 'ubuntu-24.04, linux-x64' 'macos-15-intel, mac-x64' 'macos-15, mac-arm64' 'windows-2025, windows-x64'; do
            if ! jq -e --arg name "build ($platform)" '
              [.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0
            ' <<< "$checks" >/dev/null; then
              echo "Build check for $platform is not successful; leaving PR open."
              exit 0
            fi
          done

          changed=$(gh api "repos/$REPO/pulls/$pr/files?per_page=100" --paginate --jq '.[].filename')
          if grep -Eq '^(README.md|AGENTS.md|SPRINTS.md|BACKLOG.md|CONTRIBUTING.md|RELEASES.md|SECURITY.md|package(-lock)?.json|src/main/storage/store.ts|scripts/validate-readme-badges.mjs|.github/workflows/(releases|readme-badges).yml)$' <<< "$changed"; then
            if ! jq -e '
              [.check_runs[] | select(.name == "badge-validation" and .status == "completed" and .conclusion == "success")] | length > 0
            ' <<< "$checks" >/dev/null; then
              echo "Applicable README badge validation is not successful; leaving PR open."
              exit 0
            fi
          fi

          # Re-read the PR just before merging. The SHA guard rejects a new push
          # between CI inspection and the merge command.
          current=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          [[ "$current" == "$RUN_SHA" ]] || { echo "PR head changed; skipping."; exit 0; }
          echo "All applicable checks passed for owner PR #$pr at $RUN_SHA."
          gh api -X PUT "repos/$REPO/pulls/$pr/merge" \
            -f merge_method=squash -f sha="$RUN_SHA"
          # GITHUB_TOKEN-created merges do not emit downstream push workflows.
          # Explicit workflow_dispatch is permitted and preserves main-branch
          # release verification/publishing and badge validation.
          gh workflow run releases.yml --repo "$REPO" --ref main
          gh workflow run readme-badges.yml --repo "$REPO" --ref main
